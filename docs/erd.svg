<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 610" role="img" aria-labelledby="title description">
  <title id="title">ERD Aplikasi Presensi Siswa</title>
  <desc id="description">Relasi kelas satu ke banyak siswa, siswa satu ke banyak presensi. Tabel users terpisah untuk login admin.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #142744; }
      .heading { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #51627c; }
      .card { fill: #ffffff; stroke: #cbd7e7; stroke-width: 2; }
      .card-head { fill: #132744; }
      .table-name { fill: #ffffff; font-size: 20px; font-weight: 700; }
      .field { font-size: 16px; }
      .hint { font-size: 13px; fill: #5c6d85; }
      .edge { stroke: #4168c9; stroke-width: 3; fill: none; }
      .edge-label { font-size: 14px; font-weight: 700; fill: #3156ad; }
      .cardinality { font-size: 16px; font-weight: 700; fill: #3156ad; }
    </style>
  </defs>
  <rect width="1320" height="610" rx="18" fill="#f3f6fb"/>
  <text class="heading" x="56" y="54">ERD Aplikasi Presensi Siswa</text>
  <text class="subtitle" x="56" y="82">Tiga tabel inti dan satu tabel pendukung untuk akun administrator</text>

  <!-- Kelas entity -->
  <rect class="card" x="55" y="145" width="310" height="270" rx="14"/>
  <path class="card-head" d="M69 145h282a14 14 0 0 1 14 14v48H55v-48a14 14 0 0 1 14-14z"/>
  <text class="table-name" x="78" y="181">kelas</text>
  <text class="field" x="78" y="240">PK id_kelas — INT, AUTO_INCREMENT</text>
  <text class="field" x="78" y="281">nama_kelas — VARCHAR(20), UNIQUE</text>
  <text class="field" x="78" y="322">jurusan — VARCHAR(50)</text>
  <text class="hint" x="78" y="376">Satu kelas dapat memiliki banyak siswa.</text>

  <!-- Kelas to Siswa -->
  <path class="edge" d="M365 274H472"/>
  <text class="cardinality" x="377" y="260">1</text>
  <text class="cardinality" x="450" y="260">N</text>
  <text class="edge-label" x="382" y="300">anggota</text>

  <!-- Siswa entity -->
  <rect class="card" x="475" y="145" width="345" height="270" rx="14"/>
  <path class="card-head" d="M489 145h317a14 14 0 0 1 14 14v48H475v-48a14 14 0 0 1 14-14z"/>
  <text class="table-name" x="498" y="181">siswa</text>
  <text class="field" x="498" y="240">PK nisn — CHAR(10)</text>
  <text class="field" x="498" y="281">nama — VARCHAR(100)</text>
  <text class="field" x="498" y="322">alamat — VARCHAR(255), boleh NULL</text>
  <text class="field" x="498" y="363">id_kelas — INT, FK → kelas.id_kelas</text>

  <!-- Siswa to Presensi -->
  <path class="edge" d="M820 274H920"/>
  <text class="cardinality" x="834" y="260">1</text>
  <text class="cardinality" x="896" y="260">N</text>
  <text class="edge-label" x="836" y="300">melakukan</text>

  <!-- Presensi entity -->
  <rect class="card" x="923" y="145" width="340" height="270" rx="14"/>
  <path class="card-head" d="M937 145h312a14 14 0 0 1 14 14v48H923v-48a14 14 0 0 1 14-14z"/>
  <text class="table-name" x="946" y="181">presensi</text>
  <text class="field" x="946" y="240">PK id — INT, AUTO_INCREMENT</text>
  <text class="field" x="946" y="281">nisn — CHAR(10), FK → siswa.nisn</text>
  <text class="field" x="946" y="322">tanggal_waktu — DATETIME</text>
  <text class="hint" x="946" y="376">Waktu dibuat otomatis saat tap kartu.</text>

  <!-- Supporting user table, intentionally disconnected -->
  <rect class="card" x="475" y="455" width="345" height="115" rx="14"/>
  <path class="card-head" d="M489 455h317a14 14 0 0 1 14 14v34H475v-34a14 14 0 0 1 14-14z"/>
  <text class="table-name" x="498" y="486">users (pendukung)</text>
  <text class="field" x="498" y="527">id_user (PK) · username (UNIQUE) · password hash</text>
  <text class="hint" x="498" y="552">Tidak memiliki relasi dengan tabel inti.</text>
</svg>
