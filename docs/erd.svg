<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">ERD Notasi Chen — Aplikasi Presensi Siswa</title>
  <desc id="description">Entitas kelas berelasi satu ke banyak dengan siswa. Entitas siswa berelasi satu ke banyak dengan presensi. Users tidak digambar karena berdiri sendiri.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #142744; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #52627a; }
      .entity { fill: #fff; stroke: #18355d; stroke-width: 3; }
      .relationship { fill: #eef3ff; stroke: #315fc2; stroke-width: 3; }
      .attribute { fill: #fff; stroke: #7590bd; stroke-width: 2.5; }
      .entity-label { font-size: 21px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .relationship-label { font-size: 17px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .attribute-label { font-size: 16px; text-anchor: middle; dominant-baseline: middle; }
      .key { text-decoration: underline; font-weight: 700; }
      .line { stroke: #60738e; stroke-width: 2.5; fill: none; }
      .cardinality { font-size: 20px; font-weight: 700; fill: #18355d; text-anchor: middle; }
      .note { font-size: 14px; fill: #52627a; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="20" fill="#f3f6fb"/>
  <text class="title" x="56" y="58">ERD Aplikasi Presensi Siswa</text>
  <text class="subtitle" x="56" y="88">Notasi Chen · 3 entitas inti · 2 relasi</text>

  <!-- Kelas attributes -->
  <line class="line" x1="270" y1="285" x2="270" y2="350"/>
  <ellipse class="attribute" cx="270" cy="245" rx="95" ry="34"/>
  <text class="attribute-label key" x="270" y="245">id_kelas</text>

  <line class="line" x1="190" y1="410" x2="161" y2="410"/>
  <ellipse class="attribute" cx="82" cy="410" rx="79" ry="34"/>
  <text class="attribute-label" x="82" y="410">nama_kelas</text>

  <line class="line" x1="270" y1="470" x2="270" y2="535"/>
  <ellipse class="attribute" cx="270" cy="575" rx="75" ry="34"/>
  <text class="attribute-label" x="270" y="575">jurusan</text>

  <!-- Kelas entity -->
  <rect class="entity" x="190" y="350" width="160" height="120" rx="3"/>
  <text class="entity-label" x="270" y="410">kelas</text>

  <!-- Kelas 1:N Siswa relationship -->
  <line class="line" x1="350" y1="410" x2="372" y2="410"/>
  <line class="line" x1="488" y1="410" x2="585" y2="410"/>
  <polygon class="relationship" points="430,350 488,410 430,470 372,410"/>
  <text class="relationship-label" x="430" y="410">anggota</text>
  <text class="cardinality" x="360" y="390">1</text>
  <text class="cardinality" x="555" y="390">N</text>

  <!-- Siswa attributes -->
  <line class="line" x1="665" y1="285" x2="665" y2="350"/>
  <ellipse class="attribute" cx="665" cy="245" rx="75" ry="34"/>
  <text class="attribute-label key" x="665" y="245">nisn</text>

  <line class="line" x1="625" y1="470" x2="568" y2="535"/>
  <ellipse class="attribute" cx="540" cy="565" rx="68" ry="34"/>
  <text class="attribute-label" x="540" y="565">nama</text>

  <line class="line" x1="705" y1="470" x2="762" y2="535"/>
  <ellipse class="attribute" cx="790" cy="565" rx="68" ry="34"/>
  <text class="attribute-label" x="790" y="565">alamat</text>

  <!-- Siswa entity -->
  <rect class="entity" x="585" y="350" width="160" height="120" rx="3"/>
  <text class="entity-label" x="665" y="410">siswa</text>

  <!-- Siswa 1:N Presensi relationship -->
  <line class="line" x1="745" y1="410" x2="842" y2="410"/>
  <line class="line" x1="958" y1="410" x2="1055" y2="410"/>
  <polygon class="relationship" points="900,350 958,410 900,470 842,410"/>
  <text class="relationship-label" x="900" y="410">melakukan</text>
  <text class="cardinality" x="775" y="390">1</text>
  <text class="cardinality" x="1025" y="390">N</text>

  <!-- Presensi attributes -->
  <line class="line" x1="1135" y1="285" x2="1135" y2="350"/>
  <ellipse class="attribute" cx="1135" cy="245" rx="70" ry="34"/>
  <text class="attribute-label key" x="1135" y="245">id</text>

  <line class="line" x1="1175" y1="470" x2="1235" y2="535"/>
  <ellipse class="attribute" cx="1265" cy="565" rx="105" ry="34"/>
  <text class="attribute-label" x="1265" y="565">tanggal_waktu</text>

  <!-- Presensi entity -->
  <rect class="entity" x="1055" y="350" width="160" height="120" rx="3"/>
  <text class="entity-label" x="1135" y="410">presensi</text>

  <text class="note" x="56" y="685">Atribut kunci digarisbawahi. FK tidak ditampilkan pada ERD konseptual.</text>
  <text class="note" x="56" y="710">Tabel users untuk login berdiri sendiri, sehingga tidak digambar pada ERD.</text>
</svg>
